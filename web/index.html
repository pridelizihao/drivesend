<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f5f7">
<meta name="color-scheme" content="light">
<title>DriveSend</title>
<link rel="stylesheet" href="style.css?v=17">
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span>DriveSend</div>
  <div class="me">
    <span id="deviceName">本机</span>
    <span id="conn" class="pill">连接中</span>
    <button id="userBtn" class="user-btn" hidden><span id="userName"></span></button>
    <div id="userMenu" class="user-menu" hidden>
      <button id="logoutBtn">退出登录</button>
    </div>
  </div>
</header>

<div class="layout">
  <nav class="side">
    <button class="nav-item is-active" data-view="files">文件</button>
    <button class="nav-item" data-view="inbox">传输站<em id="inboxBadge" class="badge" hidden>0</em></button>
    <button class="nav-item" data-view="shares">分享</button>
    <button class="nav-item" data-view="trash">回收站</button>
    <div class="meter">
      <div class="meter-label">已用空间</div>
      <div id="usage">—</div>
      <div class="quota-bar"><i id="quotaFill"></i></div>
      <div class="meter-sub" id="saved"></div>
    </div>
  </nav>

  <main class="main">
    <div class="toolbar">
      <div id="crumbs" class="crumbs"></div>
      <div class="search">
        <input id="searchInput" type="search" placeholder="搜索文件" autocomplete="off">
      </div>
      <div class="actions">
        <button id="newFolder" class="btn ghost">新建文件夹</button>
        <button id="qrBtn" class="btn ghost" hidden>手机扫码</button>
        <button id="pick" class="btn">上传文件</button>
        <input id="fileInput" type="file" multiple hidden>
      </div>
    </div>
    <div id="list" class="list"></div>
    <div id="drop" class="drop">松开即可上传</div>
  </main>
</div>

<div id="batchBar" class="batch-bar" hidden>
  <span id="batchCount">已选 0 项</span>
  <span class="batch-sep"></span>
  <button id="batchMove" class="btn ghost small">移动</button>
  <button id="batchDelete" class="btn ghost small danger-text">删除</button>
  <button id="batchClear" class="btn ghost small">取消</button>
</div>

<div id="queue" class="queue"></div>
<div id="toasts" class="toasts"></div>
<script src="qrcode.js?v=1"></script>
<script src="vendor/pdf.min.js?v=1"></script>
<script type="module" src="app.js?v=17"></script>
</body>
</html>
